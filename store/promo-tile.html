<!doctype html><meta charset=utf-8>
<title>CyKit promo tile 440x280</title>
<!--
  Small promotional tile, 440x280. The store guidance asks for saturated
  colour, well-defined edges and little text, and warns that an item without
  this image ranks lower in search. Full bleed on purpose: no white margin.
-->
<style>
 html,body{margin:0;width:440px;height:280px;overflow:hidden}
 body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
   background:linear-gradient(145deg,#4da3e8 0%,#2f7fd1 45%,#14508a 100%);
   font:16px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif;color:#fff}
 svg{filter:drop-shadow(0 4px 10px rgba(0,30,60,.30))}
 .name{font-size:38px;font-weight:700;letter-spacing:-0.02em;line-height:1}
 .tag{font-size:14px;font-weight:500;color:rgba(255,255,255,.88)}
</style>
<svg width="84" height="84" viewBox="0 0 100 100" fill="none">
  <g stroke="#fff" stroke-width="3.2" stroke-linecap="round">
    <line x1="50" y1="50" x2="50"   y2="23"/>
    <line x1="50" y1="50" x2="73.4" y2="63.5"/>
    <line x1="50" y1="50" x2="26.6" y2="63.5"/>
  </g>
  <circle cx="50"   cy="50"   r="10.5" fill="#fff"/>
  <circle cx="50"   cy="23"   r="7.2"  fill="#fff"/>
  <circle cx="73.4" cy="63.5" r="7.2"  fill="#fff"/>
  <circle cx="26.6" cy="63.5" r="7.2"  fill="#fff"/>
</svg>
<div class=name>CyKit</div>
<div class=tag>Read and share work items faster</div>
